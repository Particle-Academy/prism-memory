name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: 8.2
            laravel: 13.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite/pdo_sqlite are what the suite runs against, and the schema
          # relies on foreign keys actually being enforced.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      # NOTHING IN THIS ESTATE HAD EVER AUDITED A PHP DEPENDENCY. Where
      # composer.lock is gitignored -- correct for a library, since consumers
      # resolve their own -- Dependabot has no lock to scan, so it reported zero
      # open alerts. That zero was never a measurement: the first audit ever run
      # found the same Laravel advisory in eight of ten PHP repositories.
      #
      # Runs after the install so it audits what CI actually RESOLVED, and before
      # the tests so a vulnerable tree fails the run rather than passing quietly.
      - name: Audit dependencies for known advisories
        run: composer audit --no-interaction

      - name: Execute tests
        run: vendor/bin/pest

  pgvector:
    name: pgvector driver, against a real Postgres
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10

    # WHY THIS JOB EXISTS. `tests/PgVectorStoreTest.php` skips itself unless
    # MEMORY_PGVECTOR_DSN is set, and nothing set it — so a 357-line vector
    # store shipped with a suite that had never run, here or anywhere, while
    # every Tests run reported green. The skip message was honest about it and
    # that changed nothing: nobody investigates a clean report. See
    # `.ai/knowledge/gates-pointed-at-nothing.md` in the envelope.
    #
    # Its own job rather than the matrix: pgvector cannot be faked into SQLite,
    # and standing a database up in all ten matrix legs buys no coverage the
    # driver does not already have from one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      # MEMORY_PGVECTOR_REQUIRED turns the suite's skip into a failure. Without
      # it a Postgres service that never came up would leave this job green and
      # skipping, which is the failure it was added to prevent.
      - name: Execute the pgvector suite
        env:
          MEMORY_PGVECTOR_DSN: pgsql:host=127.0.0.1;port=5432;dbname=prism_memory
          MEMORY_PGVECTOR_USER: prism
          MEMORY_PGVECTOR_PASSWORD: prism
          MEMORY_PGVECTOR_REQUIRED: '1'
        run: vendor/bin/pest tests/PgVectorStoreTest.php

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. This has to pass BEFORE a tag is pushed: Packagist publishes a
      # Composer package the moment its tag exists, so the release guard, which
      # requires this workflow to have succeeded, can only withhold the GitHub
      # release. It cannot withdraw a version.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
